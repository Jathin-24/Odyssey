# AWS RDS MySQL
spring.datasource.url=jdbc:mysql://odyssey-db.cdsucyk8ge3u.ap-southeast-2.rds.amazonaws.com:3306/odyssey?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=subhashS
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Database connection pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf Template Cache (disable for instant updates)
spring.thymeleaf.cache=false

# Session Inactivity Timeout (30 minutes)
server.servlet.session.timeout=30m


spring.application.name=odyssey

# ---- Database (PostgreSQL) ----
# Driven by environment variables so the same build runs locally and on Render.
# Defaults below are for local development only.

# spring.datasource.url=jdbc:mysql://localhost:3306/odyssey_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/odyssey}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Supabase Storage (payment screenshots) ----
# Leave SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY empty to fall back to the local uploads/ folder.

supabase.storage.url=${SUPABASE_URL:}
supabase.storage.key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_BUCKET:payments}

# ---- Admin login ----
odyssey.admin.username=${ADMIN_USERNAME:finance}
odyssey.admin.password=${ADMIN_PASSWORD:Toinfinityandbeyond}

# ---- Server ----
# Render sets PORT; bind to it when present.
server.port=${PORT:8080}
# Required behind Render's proxy so redirects and HTTPS URLs are generated correctly.
server.forward-headers-strategy=framework

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf Template Cache (disable for instant updates)
spring.thymeleaf.cache=false

# Session Inactivity Timeout (30 minutes)
server.servlet.session.timeout=30m

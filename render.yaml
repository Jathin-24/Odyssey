# Render free-tier blueprint for Odyssey
# After connecting the GitHub repo, Render picks this up automatically.
# Secrets (marked sync: false) are set in the Render dashboard -> Environment.
services:
  - type: web
    name: odyssey
    runtime: java
    plan: free
    buildCommand: mvn -DskipTests clean package
    startCommand: java -jar target/odyssey-1.0.0.jar
    healthCheckPath: /faq
    envVars:
      - key: JAVA_VERSION
        value: "17"
      # --- Database (Supabase free PostgreSQL) ---
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # --- Supabase Storage (payment screenshots) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: payments
      # --- Admin login ---
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
